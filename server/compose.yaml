services:
  api:
    build: .
    env_file: .env
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-47863}:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  telegram:
    build: .
    image: grandma-health-telegram
    profiles: [telegram]
    env_file: .env
    entrypoint: [php, artisan, telegram:run]
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, php, artisan, telegram:health]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
